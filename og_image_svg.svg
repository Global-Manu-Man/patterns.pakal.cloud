<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:0.95" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Main Content Card -->
  <rect x="100" y="100" width="1000" height="430" rx="20" fill="url(#cardGradient)" filter="url(#shadow)"/>
  
  <!-- Top Gradient Line -->
  <rect x="100" y="100" width="1000" height="6" rx="3" fill="url(#bgGradient)"/>
  
  <!-- Main Title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    🏗️ Top 12 Microservices Patterns
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#34495e">
    Essential patterns for building resilient, scalable architectures
  </text>
  
  <!-- Author -->
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#7f8c8d">
    by Shalini Goyal | @goyalshalini
  </text>
  
  <!-- Pattern Icons Row -->
  <g transform="translate(200, 340)">
    <!-- Pattern 1 -->
    <circle cx="50" cy="50" r="35" fill="#667eea" opacity="0.1"/>
    <circle cx="50" cy="50" r="25" fill="#667eea"/>
    <text x="50" y="58" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">🌐</text>
    
    <!-- Pattern 2 -->
    <circle cx="150" cy="50" r="35" fill="#e74c3c" opacity="0.1"/>
    <circle cx="150" cy="50" r="25" fill="#e74c3c"/>
    <text x="150" y="58" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">📚</text>
    
    <!-- Pattern 3 -->
    <circle cx="250" cy="50" r="35" fill="#f39c12" opacity="0.1"/>
    <circle cx="250" cy="50" r="25" fill="#f39c12"/>
    <text x="250" y="58" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">📝</text>
    
    <!-- Pattern 4 -->
    <circle cx="350" cy="50" r="35" fill="#27ae60" opacity="0.1"/>
    <circle cx="350" cy="50" r="25" fill="#27ae60"/>
    <text x="350" y="58" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">📖</text>
    
    <!-- Pattern 5 -->
    <circle cx="450" cy="50" r="35" fill="#9b59b6" opacity="0.1"/>
    <circle cx="450" cy="50" r="25" fill="#9b59b6"/>
    <text x="450" y="58" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">🎯</text>
    
    <!-- Pattern 6 -->
    <circle cx="550" cy="50" r="35" fill="#3498db" opacity="0.1"/>
    <circle cx="550" cy="50" r="25" fill="#3498db"/>
    <text x="550" y="58" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">🔍</text>
    
    <!-- Pattern 7 -->
    <circle cx="650" cy="50" r="35" fill="#e67e22" opacity="0.1"/>
    <circle cx="650" cy="50" r="25" fill="#e67e22"/>
    <text x="650" y="58" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">⚡</text>
    
    <!-- Pattern 8 -->
    <circle cx="750" cy="50" r="35" fill="#1abc9c" opacity="0.1"/>
    <circle cx="750" cy="50" r="25" fill="#1abc9c"/>
    <text x="750" y="58" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" font-weight="bold">🚧</text>
  </g>
  
  <!-- Bottom Text -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#667eea" font-weight="bold">
    patterns.pakal.cloud
  </text>
</svg>